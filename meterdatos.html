<div class="container">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            
            <h2>Registrar Personaje</h2>
            
            <div id="mensaje-status"></div>

            <div class="formulario-contenedor">
                <form id="formulario-registro">
                    
                    <div class="form-group">
                        <label>Nombre Real:</label>
                        <input type="text" id="nombre" class="form-control" required placeholder="Ej. Peter Parker">
                    </div>

                    <div class="form-group">
                        <label>Alias / Nombre de Héroe:</label>
                        <input type="text" id="alias" class="form-control" required placeholder="Ej. Spider-Man">
                    </div>

                    <div class="form-group">
                        <label>Fecha de Creación:</label>
                        <input type="date" id="fecha_creacion" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Descripción:</label>
                        <input type="text" id="descripcion" class="form-control" required placeholder="Ej. El superhéroe que teje telarañas.">
                    </div>

                    <div class="form-group">
                        <label>Título del Cómic Debut:</label>
                        <input type="text" id="titulo_comic" class="form-control" required placeholder="Ej. Amazing Fantasy #15">
                    </div>

                    <div class="form-group">
                        <label>Superpoder Principal:</label>
                        <input type="text" id="superpoder" class="form-control" required placeholder="Ej. Trepar paredes, sentido arácnido">
                    </div>

                    <br>
                    <button type="submit" class="btn btn-info btn-block btn-lg" style="font-weight: bold; background-color: #0284c7; border: none;">
                        <span class="glyphicon glyphicon-floppy-disk"></span> Guardar en la Tabla
                    </button>

                </form>
            </div>

        </div>
    </div>
</div>

<script src="db.js"></script>
<script>
    // Mostrar notificaciones basadas en parámetros de URL
    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const status = params.get('status');
        const msgDiv = document.getElementById('mensaje-status');
        
        if (status === 'ok') {
            msgDiv.innerHTML = "<div class='alert alert-success'><b>¡Éxito!</b> El personaje se guardó correctamente.</div>";
        } else if (status === 'error') {
            msgDiv.innerHTML = "<div class='alert alert-danger'><b>Error:</b> No se pudieron guardar los datos.</div>";
        }
    });

    // Procesar envío del formulario
    document.getElementById('formulario-registro').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nombreVal = document.getElementById('nombre').value.trim();
        const aliasVal = document.getElementById('alias').value.trim();
        const fechaVal = document.getElementById('fecha_creacion').value;
        const descVal = document.getElementById('descripcion').value.trim();
        const comicVal = document.getElementById('titulo_comic').value.trim();
        const poderVal = document.getElementById('superpoder').value.trim();

        db.ready.then(() => {
            const nuevoHeroe = {
                nombre: nombreVal,
                personaje: aliasVal,
                alias: aliasVal,
                altura: 0,
                peso: 0,
                poderes: poderVal,
                superpoder: poderVal,
                sexo: 'N/A',
                debilidad: 'Ninguna',
                creacion: fechaVal,
                fecha_creacion: fechaVal,
                biografia: descVal,
                descripcion: descVal,
                titulo_comic: comicVal
            };

            db.insert('universoheroes', 'superheroes', nuevoHeroe);
            
            // Redirigir a la lista general
            window.location.href = 'mostrar.html';
        });
    });
</script>
