<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eduardo Mizael Ruiz Santiago</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="estilos.css" />
</head>
<body>

<div class="container" style="margin-top: 30px;">
    
    <div class="alert alert-warning alert-dismissible" role="alert" id="alerta-borrado" style="display: none;">
        <button type="button" class="close" onclick="document.getElementById('alerta-borrado').style.display = 'none';"><span aria-hidden="true">&times;</span></button>
        <strong>¡Atención!</strong> El superhéroe fue eliminado correctamente de la lista.
    </div>

    <h2>Superhéroes Registrados</h2>
    <div style="margin-bottom: 20px;">
        <a class="btn btn-primary" href="meterdatos.html">Meter Datos</a>
        <a class="btn btn-default" href="index.html">Inicio</a>
    </div>

    <div id="contenedor-tabla">
        <div class="alert alert-info">Cargando personajes...</div>
    </div>
</div>

<script src="db.js"></script>
<script>
    function renderTabla() {
        const contenedor = document.getElementById('contenedor-tabla');
        const superheroes = db.get('universoheroes', 'superheroes');

        if (superheroes.length > 0) {
            let html = `
                <div class="table-responsive">
                    <table class="table table-striped table-bordered table-hover" style="margin-bottom: 0;">
                        <thead>
                            <tr class="active">
                                <th>Nombre</th>
                                <th>Personaje</th>
                                <th>Altura (m)</th>
                                <th>Peso (kg)</th>
                                <th>Poderes</th>
                                <th>Sexo</th>
                                <th>Debilidad</th>
                                <th>F. Creación</th>
                                <th>Biografía</th>
                                <th style="text-align: center; width: 100px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            // Renderizado en orden inverso para ver los más nuevos primero
            [...superheroes].reverse().forEach(heroe => {
                html += `
                    <tr id="heroe-row-${heroe.id}">
                        <td><strong>${escapeHtml(heroe.nombre || '')}</strong></td>
                        <td>${escapeHtml(heroe.personaje || '')}</td>
                        <td>${heroe.altura || '0'}</td>
                        <td>${heroe.peso || '0'}</td>
                        <td>${escapeHtml(heroe.poderes || '')}</td>
                        <td>${escapeHtml(heroe.sexo || '')}</td>
                        <td>${escapeHtml(heroe.debilidad || '')}</td>
                        <td>${escapeHtml(heroe.creacion || heroe.fecha_creacion || '')}</td>
                        <td>${escapeHtml(heroe.biografia || heroe.descripcion || '')}</td>
                        <td style="text-align: center; vertical-align: middle;">
                            <button class="btn btn-danger btn-sm" onclick="borrarHeroe(${heroe.id}, '${escapeQuote(heroe.nombre)}')">
                                <span class="glyphicon glyphicon-trash"></span> Borrar
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
            contenedor.innerHTML = html;
        } else {
            contenedor.innerHTML = '<div class="alert alert-info">No hay superhéroes registrados todavía.</div>';
        }
    }

    function borrarHeroe(id, nombre) {
        if (confirm(`¿Seguro que deseas eliminar a ${nombre}?`)) {
            db.delete('universoheroes', 'superheroes', 'id', id);
            
            // Mostrar alerta de borrado
            const alerta = document.getElementById('alerta-borrado');
            alerta.style.display = 'block';
            
            // Volver a renderizar la tabla
            renderTabla();
        }
    }

    // Funciones auxiliares para sanitizar datos
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function escapeQuote(str) {
        return String(str).replace(/'/g, "\\'");
    }

    // Inicializar la tabla cuando la base de datos esté lista
    db.ready.then(() => {
        renderTabla();
    });
</script>
</body>
</html>
