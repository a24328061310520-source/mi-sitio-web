<h1>Cine</h1>
<h2>Películas</h2>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Titulo</th>
            <th>Año</th>
            <th>Director</th>
            <th>Actores</th>
            <th>Personajes</th>
        </tr>
    </thead>
    <tbody id="cine-tabla-body">
        <tr>
            <td colspan="6" class="text-center">Cargando datos de películas...</td>
        </tr>
    </tbody>
</table>

<script>
    // Limpiar base de datos obsoleta en localStorage si contiene películas incorrectas o está vacía
    try {
        const localCine = localStorage.getItem('db_cine');
        if (localCine) {
            const parsed = JSON.parse(localCine);
            const isOutdated = localCine.includes('Pacific Rim');
            const isEmpty = !parsed.peliculas || parsed.peliculas.length === 0;
            if (isOutdated || isEmpty) {
                localStorage.removeItem('db_cine');
                window.location.reload();
            }
        } else {
            // Si no existe, también podemos limpiar por seguridad
            localStorage.removeItem('db_cine');
        }
    } catch (e) {
        console.error(e);
    }
</script>
<script src="db.js"></script>
<script>
    db.ready.then(() => {
        const tbody = document.getElementById('cine-tabla-body');
        
        // Obtener tablas de la base de datos "cine"
        const peliculas = db.get('cine', 'peliculas');
        const directores = db.get('cine', 'directores');
        const actores = db.get('cine', 'actores');
        const peliculaactor = db.get('cine', 'peliculaactor');

        // Simular LEFT JOINs y GROUP BY (por PeliculaID)
        if (peliculas.length > 0) {
            let html = '';
            
            peliculas.forEach(p => {
                // Director
                const dir = directores.find(d => String(d.DirectorID) === String(p.DirectorID));
                const directorNombre = dir ? dir.Nombre : 'Desconocido';

                // Actores y Personajes de la película
                const rels = peliculaactor.filter(pa => String(pa.PeliculaID) === String(p.PeliculaID));
                
                const actorNombres = [];
                const personajeNombres = [];

                rels.forEach(rel => {
                    const actor = actores.find(a => String(a.ActorID) === String(rel.ActorID));
                    if (actor) {
                        actorNombres.push(actor.Nombre);
                    }
                    if (rel.Personaje) {
                        personajeNombres.push(rel.Personaje);
                    }
                });

                // Simular GROUP_CONCAT(DISTINCT ...)
                const uniqueActors = [...new Set(actorNombres)].join(', ');
                const uniquePersonajes = [...new Set(personajeNombres)].join(', ');

                html += `
                    <tr>
                        <td>${p.PeliculaID}</td>
                        <td><strong>${escapeHtml(p.Titulo)}</strong></td>
                        <td>${p.AnioLanzamiento}</td>
                        <td>${escapeHtml(directorNombre)}</td>
                        <td>${escapeHtml(uniqueActors || 'N/A')}</td>
                        <td>${escapeHtml(uniquePersonajes || 'N/A')}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        } else {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center">No se encontraron datos</td></tr>`;
        }
    }).catch(err => {
        document.getElementById('cine-tabla-body').innerHTML = `
            <tr><td colspan="6" style="color:red; text-align:center;">Error al cargar películas: ${err}</td></tr>
        `;
    });

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }
</script>
